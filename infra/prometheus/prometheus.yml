# Recolección de métricas propias. Cada servicio expone /internal/metrics solo
# al rol service; el token lo escribe el entrypoint en /tmp/token y no se
# versiona. honor_labels conserva service e instance (fleet-a/fleet-b).
global:
  scrape_interval: 5s
  evaluation_interval: 5s
rule_files: [/etc/prometheus/alerts.yml]
scrape_configs:
  - job_name: car-cruds
    metrics_path: /internal/metrics
    honor_labels: true
    authorization: {type: Bearer, credentials_file: /tmp/token}
    static_configs:
      - targets: [gateway:8080, customers:8080, rentals:8080, employees:8080, fleet-a:8080, fleet-b:8080, indexer:8080]
