events { worker_connections 1024; }
http {
  log_format correlated escape=json '{"service":"fleet-lb","request_id":"$http_x_request_id","traceparent":"$http_traceparent","status":$status,"upstream":"$upstream_addr","duration":$request_time}';
  access_log /dev/stdout correlated;
  error_log /dev/stderr warn;
  upstream fleet {
    server fleet-a:8080 max_fails=3 fail_timeout=30s;
    server fleet-b:8080 max_fails=3 fail_timeout=30s;
    keepalive 32;
  }
  server {
    listen 8080;
    location / {
      proxy_pass http://fleet;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Authorization $http_authorization;
      proxy_set_header X-Request-ID $http_x_request_id;
      proxy_set_header traceparent $http_traceparent;
      proxy_set_header tracestate $http_tracestate;
      proxy_connect_timeout 1s;
      proxy_read_timeout 3s;
      proxy_send_timeout 1s;
      proxy_next_upstream error timeout;
      proxy_next_upstream_tries 2;
      proxy_next_upstream_timeout 1s;
      proxy_ignore_client_abort off;
    }
  }
}
