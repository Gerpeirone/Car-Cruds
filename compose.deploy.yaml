# Superposición para la VM pública. Uso:
#   docker compose -f compose.yaml -f compose.deploy.yaml up -d --build --wait
# Ver docs/DESPLIEGUE.md.
services:
  postgres:
    restart: unless-stopped
  mongo:
    restart: unless-stopped
  redis:
    restart: unless-stopped
  rabbitmq:
    restart: unless-stopped
  solr:
    restart: unless-stopped
  jaeger:
    restart: unless-stopped
  fleet-lb:
    restart: unless-stopped
  # Interfaz estática; solo Caddy la publica, sin puerto propio en la VM.
  web:
    build: {context: ./frontend, dockerfile: Dockerfile}
    restart: unless-stopped
    depends_on:
      gateway: {condition: service_healthy, restart: true}
  caddy:
    image: caddy:2.10.2@sha256:c3d7ee5d2b11f9dc54f947f68a734c84e9c9666c92c88a7f30b9cba5da182adb
    restart: unless-stopped
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?Definir PUBLIC_HOST en .env (ver docs/DESPLIEGUE.md)}
    ports: ["80:80", "443:443"]
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./docs/contracts/employees-openapi.json:/srv/contracts/employees-openapi.json:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: {gateway: {condition: service_healthy}, web: {condition: service_healthy}}

volumes:
  caddy-data:
  caddy-config:
