# Entorno de prueba propio. El código del proveedor se lee desde un checkout
# fijado por commit; no se modifica ni se utiliza su despliegue real.
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${CLINIC_TEST_DB_PASSWORD:?Solo laboratorio}
      MYSQL_DATABASE: turnos
      MYSQL_USER: turnos
      MYSQL_PASSWORD: ${CLINIC_TEST_DB_PASSWORD}
    healthcheck:
      test: [CMD-SHELL, 'mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent']
      interval: 3s
      timeout: 3s
      retries: 40
  rabbitmq:
    image: rabbitmq:4-management@sha256:8dd6e3570ddaa2ef82a6c3a8950e79c1f73893adfbdddbc374fc1f1ac8a0f5dd
    environment:
      RABBITMQ_DEFAULT_USER: clinic-test
      RABBITMQ_DEFAULT_PASS: ${CLINIC_TEST_DB_PASSWORD}
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, -q, ping]
      interval: 3s
      timeout: 5s
      retries: 40
  turnos:
    build:
      context: ${CLINIC_PROVIDER_CHECKOUT:?Checkout del commit documentado}
      dockerfile: infra/Dockerfile.backend
      args: {SERVICE_PATH: ./services/turnos/cmd}
    environment:
      HTTP_ADDR: 0.0.0.0:8081
      TURNOS_DB_DSN: turnos:${CLINIC_TEST_DB_PASSWORD}@tcp(mysql:3306)/turnos
      RABBITMQ_URL: amqp://clinic-test:${CLINIC_TEST_DB_PASSWORD}@rabbitmq:5672/
      TURNOS_PARTNER_KEYS: car-cruds-contract:${CLINIC_TEST_API_KEY:?Clave ficticia local},other-contract:${CLINIC_TEST_OTHER_API_KEY:?Segunda clave ficticia local}
      # Precio ficticio para verificar que un reintento no duplique el efecto.
      # No representa una tarifa acordada con el proveedor.
      TURNOS_PARTNER_PRICE_CENTS: "12345"
      TURNOS_PARTNER_CURRENCY: ARS
      TURNOS_PARTNER_RATE: "60"
      OTEL_SDK_DISABLED: "true"
    depends_on:
      mysql: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8081/healthz]
      interval: 3s
      timeout: 3s
      retries: 40
  gateway:
    build:
      context: ${CLINIC_PROVIDER_CHECKOUT:?Checkout del commit documentado}
      dockerfile: infra/Dockerfile.backend
      args: {SERVICE_PATH: ./gateway/cmd}
    environment:
      HTTP_ADDR: 0.0.0.0:8080
      PUBLIC_HTTP_ADDR: 0.0.0.0:8088
      TURNOS_URL: http://turnos:8081
      # No se consume Notificaciones: ninguna operación de esta prueba lo requiere.
      NOTIFICATIONS_URL: http://127.0.0.1:8085
      OTEL_SDK_DISABLED: "true"
    depends_on:
      turnos: {condition: service_healthy}
    # Se publica únicamente el listener público; no el interno ni Turnos.
    ports: ["127.0.0.1:58088:8088"]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8088/healthz]
      interval: 3s
      timeout: 3s
      retries: 40
